<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Run-In-Out</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root {
        --bg: #f9f9f7;
        --ink: #111;
        --muted: #666;
        --accent: #eb6834;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0d;
          --ink: #f2f2f2;
          --muted: #a0a0a0;
          --accent: #f07a45;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        max-width: 22rem;
        margin: 0 auto 20px;
        line-height: 1.5;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Sin conexión</h1>
      <p>Run-In-Out necesita internet para cargar tu plan y tus entrenos. Cuando vuelvas a tener cobertura, reintenta.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
